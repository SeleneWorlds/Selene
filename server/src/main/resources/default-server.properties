# suppress inspection "UnusedProperty" for whole file

# The name of the server. This is displayed in the server list.
name=New Server

# The path to the directory where the server will store its save data.
save_path=save

# The path to the directory where the server will find bundles configured in the bundles property.
bundles_path=bundles

# The port used for game connections.
port=8147

# The port used for browser WebSocket game connections. Set to 0 to disable.
web_socket_port=8148

# Maximum decoded packets buffered for one client. Clients exceeding this limit are disconnected.
max_queued_packets_per_client=256

# Maximum packets handled from one client during a server tick.
max_packets_per_client_per_tick=64

# Optional per-client packet limits. Unlisted packet classes have no individual rate limit.
# Each bucket starts full, refills at packets_per_second, and holds at most burst packets.
# Excess packets are silently dropped before queueing, on both TCP and WebSocket.
# Use registered client packet class names.
# Examples (uncomment to enable; tune rates for your game's input frequency):
# packet_rate_limits.RequestMovePacket.packets_per_second=20
# packet_rate_limits.RequestMovePacket.burst=10
# packet_rate_limits.RequestFacingPacket.packets_per_second=20
# packet_rate_limits.RequestFacingPacket.burst=10
# packet_rate_limits.PreferencesPacket.packets_per_second=1
# packet_rate_limits.PreferencesPacket.burst=2

# Optional per-client custom payload limits, applied in addition to CustomPayloadPacket limits.
# These override Lua defaults registered with Network.setDefaultPayloadRateLimit("example:chat", 1, 5).
# Lua defaults are removed with their bundle; later registrations take precedence over earlier defaults.
# Only configured IDs get buckets. Unlisted IDs still obey any overall packet limit.
# The overall packet budget counts attempts even when the payload-specific limit rejects them.
# Examples (uncomment to enable):
# payload_rate_limits.example.chat.packets_per_second=1
# payload_rate_limits.example.chat.burst=5
# payload_rate_limits.example.create_character.packets_per_second=0.1
# payload_rate_limits.example.create_character.burst=1
# payload_rate_limits.example.shop.buy.packets_per_second=5
# payload_rate_limits.example.shop.buy.burst=5

# The public WebSocket URL advertised to the web client. If empty, the client uses the page hostname and web_socket_port.
# Set this when a reverse proxy exposes the WebSocket on a different hostname, port, or path.
announced_web_socket=

# The canonical public HTTPS origin of the API, without a path. This takes precedence over proxy headers.
# It is optional when trusted proxy headers are enabled, or for local/insecure development.
announced_api=

# Proxy header format: none, forwarded (RFC 7239), or x-forwarded.
# Enabling this allows OAuth to derive its public origin from those headers. Only enable it when the API port is not
# directly accessible and the reverse proxy overwrites client-supplied forwarding headers.
proxy_headers=none

# The port used for HTTP API, queue, bundle, and status endpoints.
api_port=8080

# A comma-separated list of origins allowed to access the API from browsers.
# Use * to explicitly allow every origin. Leave empty to disable CORS.
api_cors_origins=

# A comma-seperated list of bundles to load. Bundles are loaded in order they are listed. Dependencies are automatically included.
bundles=

# Insecure mode will completely disable authentication. Only set this to true if your server has other means of authentication (or is a local development server)!
insecure_mode=false

# Set this to true if you want your server to be visible in the server list.
public=false

# Enable hot reloading of bundles when files change. Accepted values: false, true, eager.
hot_reload=false

# The active grid identifier. If empty, the first registered grid is used.
grid=
