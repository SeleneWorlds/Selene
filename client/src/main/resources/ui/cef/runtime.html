<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="__SELENE_CSP__">
    <style>
        html, body, #bundle-ui {
            position: absolute;
            inset: 0;
            margin: 0;
            background: transparent;
            overflow: hidden
        }

        .bundle-ui-host {
            position: absolute;
            inset: 0;
            pointer-events: none
        }
    </style>
</head>
<body>
<div id="bundle-ui"></div>
<script type="module" nonce="selene-runtime">
    const entries = __SELENE_UI_ENTRIES__;
    const developmentSupport = __SELENE_DEVELOPMENT_SUPPORT__;
    const mounted = [];
    const payloadCallbacks = new Map();
    const capturedKeys = new Map();
    const passthroughKeys = new Map();
    const pointerDownCallbacks = new Set();
    const pointerUpCallbacks = new Set();
    let textCaptureCount = 0;
    let interactionReportingEnabled = false;
    let nextSubscriptionId = 1;
    let worldCoordinate = {x: 0, y: 0, z: 0};
    const worldTiles = new Map();
    const cameraCallbacks = new Set();
    const mapCallbacks = new Set();
    const visualDefinitions = new Map();
    const worldTileKey = tile => `${tile.x}:${tile.y}:${tile.z}`;
    function describeError(error) {
        if (!(error instanceof Error)) return String(error);
        return error.stack || `${error.name}: ${error.message}`;
    }
    function logMountError(entry, error) {
        const hint = entry.bundle === 'configured' && entry.id === 'configured'
            ? ' Check that the configured browser UI development server is running and reachable.'
            : '';
        console.error(
            `Bundle UI ${entry.bundle}:${entry.id} failed to mount from ${entry.url}: ` +
            `${describeError(error)}${hint}`
        );
    }
    const applyWorldTiles = tiles => {
        for (const tile of tiles) {
            const key = worldTileKey(tile);
            if (tile.removed === true) worldTiles.delete(key); else worldTiles.set(key, tile);
        }
    };
    const worldReady = new Promise((resolve, reject) => {
        window.seleneBridgeRequest({
            request: JSON.stringify({type: 'getInitialWorldState'}),
            onSuccess: response => {
                const snapshot = JSON.parse(response);
                worldCoordinate = snapshot.camera;
                applyWorldTiles(snapshot.tiles);
                resolve();
            },
            onFailure: (code, message) => reject(new Error(`getInitialWorldState failed: ${code} ${message}`))
        });
    });
    window.seleneBridgeRequest({
        request: JSON.stringify({type: 'subscribeToWorldUpdates'}), persistent: true,
        onFailure: (code, message) => console.error('subscribeToWorldUpdates failed', code, message)
    });
    const network = Object.freeze({
        sendToServer(payloadId, payload = {}) {
            window.seleneBridgeRequest({
                request: JSON.stringify({type: 'sendPayloadToServer', payloadId, payload}),
                onFailure: (code, message) => console.error('sendToServer failed', code, message)
            });
        },
        onPayload(payloadId, callback) {
            const subscriptionId = String(nextSubscriptionId++);
            payloadCallbacks.set(subscriptionId, callback);
            const queryId = window.seleneBridgeRequest({
                request: JSON.stringify({type: 'subscribeToServerPayload', payloadId, subscriptionId}), persistent: true,
                onFailure: (code, message) => console.error('onPayload failed', code, message)
            });
            return () => {
                payloadCallbacks.delete(subscriptionId);
                window.cancelSeleneBridgeRequest(queryId);
            };
        }
    });

    function registerKeys(registry, keys, disposers) {
        const uniqueKeys = new Set(keys);
        for (const key of uniqueKeys) {
            if (typeof key !== 'string' || !key) throw new Error('Input keys must be non-empty strings');
            registry.set(key, (registry.get(key) ?? 0) + 1);
        }
        let active = true;
        const release = () => {
            if (!active) return;
            active = false;
            for (const key of uniqueKeys) {
                const count = registry.get(key) - 1;
                if (count) registry.set(key, count); else registry.delete(key);
            }
            scheduleInteractiveElementsReporting();
        };
        disposers.push(release);
        scheduleInteractiveElementsReporting();
        return release;
    }

    function executeBridgeRequest(request) {
        return new Promise((resolve, reject) => window.seleneBridgeRequest({
            request: JSON.stringify(request),
            onSuccess: resolve,
            onFailure: (code, message) => reject(new Error(`${request.type} failed: ${code} ${message}`))
        }));
    }

    function createApi(entry, disposers) {
        const registerPointerCallback = (callbacks, callback) => {
            if (typeof callback !== 'function') throw new Error('Pointer callback must be a function');
            callbacks.add(callback);
            const release = () => callbacks.delete(callback);
            disposers.push(release);
            return release;
        };
        return Object.freeze({
            apiVersion: 4,
            resolveAsset(path) {
                if (typeof path !== 'string' || path.length === 0) throw new Error('Asset path must be a non-empty string');
                return new URL(path, entry.url).href;
            },
            storage: Object.freeze({
                async load(key) {
                    const response = await executeBridgeRequest({
                        type: 'loadBundleStorageValue', bundle: entry.bundle, entrypoint: entry.id, key
                    });
                    return JSON.parse(response).value ?? null;
                },
                async save(key, value) {
                    await executeBridgeRequest({
                        type: 'saveBundleStorageValue', bundle: entry.bundle, entrypoint: entry.id, key, value
                    });
                }
            }),
            visuals: Object.freeze({
                async getDefinition(identifier) {
                    if (typeof identifier !== 'string' || identifier.length === 0) {
                        throw new Error('Visual identifier must be a non-empty string');
                    }
                    let request = visualDefinitions.get(identifier);
                    if (!request) {
                        request = executeBridgeRequest({type: 'getVisualDefinition', identifier})
                            .then(JSON.parse)
                            .catch(error => { visualDefinitions.delete(identifier); throw error; });
                        visualDefinitions.set(identifier, request);
                    }
                    return request;
                }
            }),
            input: Object.freeze({
                captureKeys: (...keys) => registerKeys(capturedKeys, keys, disposers),
                captureText: () => {
                    textCaptureCount++;
                    let active = true;
                    const release = () => {
                        if (!active) return;
                        active = false;
                        textCaptureCount--;
                        scheduleInteractiveElementsReporting();
                    };
                    disposers.push(release);
                    scheduleInteractiveElementsReporting();
                    return release;
                },
                passThroughKeys: (...keys) => registerKeys(passthroughKeys, keys, disposers),
                isPassthroughKey: key => passthroughKeys.has(key),
                onPointerDown: callback => registerPointerCallback(pointerDownCallbacks, callback),
                onPointerUp: callback => registerPointerCallback(pointerUpCallbacks, callback)
            }),
            network,
            world: Object.freeze({
                getCameraCoordinate: () => ({...worldCoordinate}),
                getMapTiles: () => [...worldTiles.values()].map(tile => ({...tile})),
                onCameraCoordinateChanged: callback => {
                    cameraCallbacks.add(callback);
                    const release = () => cameraCallbacks.delete(callback);
                    disposers.push(release);
                    return release;
                },
                onMapChanged: callback => {
                    mapCallbacks.add(callback);
                    const release = () => mapCallbacks.delete(callback);
                    disposers.push(release);
                    return release;
                }
            })
        });
    }

    async function mountEntry(entry) {
        const source = await fetch(entry.url).then(response => {
            if (!response.ok) throw new Error(`Request failed with HTTP ${response.status} ${response.statusText}`.trim());
            return response.text();
        });
        const parsed = new DOMParser().parseFromString(source, 'text/html');
        const host = document.createElement('div');
        host.className = 'bundle-ui-host';
        host.dataset.bundle = entry.bundle;
        host.dataset.entrypoint = entry.id;
        const root = host.attachShadow({mode: 'closed'});
        document.querySelector('#bundle-ui').append(host);
        for (const style of parsed.querySelectorAll('style')) root.append(style.cloneNode(true));
        for (const link of parsed.querySelectorAll('link[rel="stylesheet"][href]')) {
            const copy = document.createElement('link');
            copy.rel = 'stylesheet';
            copy.href = new URL(link.getAttribute('href'), entry.url).href;
            root.append(copy);
        }
        const content = document.createDocumentFragment();
        for (const child of [...parsed.body.childNodes]) content.append(child.cloneNode(true));
        root.append(content);
        const disposers = [];
        developmentSupport?.attachStyles(root, disposers);
        for (const script of parsed.querySelectorAll('script:not([type="module"][src])')) {
            console.warn(`${entry.bundle}:${entry.id} ignores a script element; use <script type="module" src="...">`, script);
        }
        const api = createApi(entry, disposers);
        let mountModules = 0;
        for (const script of parsed.querySelectorAll('script[type="module"][src]')) {
            const module = await import(new URL(script.getAttribute('src'), entry.url).href);
            if (typeof module.mount !== 'function') continue;
            mountModules++;
            const dispose = await module.mount(root, api);
            if (typeof dispose === 'function') disposers.push(dispose);
        }
        if (!mountModules) throw new Error('No module exports mount(root, selene)');
        mounted.push({host, root, disposers});
    }

    async function unmountAll() {
        for (const ui of mounted.splice(0)) {
            for (const dispose of ui.disposers.reverse()) {
                try {
                    await dispose();
                } catch (error) {
                    console.error('Bundle UI dispose failed', error);
                }
            }
            ui.host.remove();
        }
        interactiveElements.clear();
        resizeObserver.disconnect();
    }

    window.addEventListener('pagehide', unmountAll);

    let previousInteractiveElements = '';
    const interactiveElements = new Set();
    let interactiveElementsFrame = 0;
    let interactiveElementsRefreshPending = false;

    function scheduleInteractiveElementsReporting() {
        if (!interactionReportingEnabled || interactiveElementsFrame) return;
        interactiveElementsFrame = requestAnimationFrame(() => {
            interactiveElementsFrame = 0;
            if (interactiveElementsRefreshPending) {
                interactiveElementsRefreshPending = false;
                refreshInteractiveElements();
            }
            reportInteractiveElements();
        });
    }

    function scheduleInteractiveElementsRefresh() {
        interactiveElementsRefreshPending = true;
        scheduleInteractiveElementsReporting();
    }

    const resizeObserver = new ResizeObserver(scheduleInteractiveElementsReporting);

    function refreshInteractiveElements() {
        const current = new Set();
        for (const ui of mounted)
            for (const element of ui.root.querySelectorAll('[data-selene-interactive]')) current.add(element);
        resizeObserver.disconnect();
        interactiveElements.clear();
        for (const ui of mounted) resizeObserver.observe(ui.host);
        for (const element of current) {
            interactiveElements.add(element);
            resizeObserver.observe(element);
        }
    }

    function observeInteractiveElements(ui) {
        new MutationObserver(scheduleInteractiveElementsRefresh)
            .observe(ui.root, {subtree: true, childList: true, characterData: true, attributes: true});
        ui.root.addEventListener('focusin', scheduleInteractiveElementsReporting, true);
        ui.root.addEventListener('focusout', scheduleInteractiveElementsReporting, true);
        ui.root.addEventListener('scroll', scheduleInteractiveElementsReporting, true);
        refreshInteractiveElements();
    }

    function reportInteractiveElements() {
        const regions = [];
        let editableFocused = false;
        for (const ui of mounted) {
            const active = ui.root.activeElement;
            editableFocused ||= active instanceof HTMLInputElement || active instanceof HTMLTextAreaElement ||
                active instanceof HTMLSelectElement || active?.isContentEditable === true;
        }
        for (const element of interactiveElements) {
            const style = getComputedStyle(element);
            if (style.pointerEvents === 'none' || style.visibility === 'hidden' || style.display === 'none') continue;
            const rect = element.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) continue;
            regions.push({
                x: Math.floor(rect.x), y: Math.floor(rect.y),
                width: Math.ceil(rect.width), height: Math.ceil(rect.height)
            });
        }
        const message = JSON.stringify({
            type: 'updateInteractionState', regions, editableFocused,
            capturedKeys: [...capturedKeys.keys()], captureText: textCaptureCount > 0,
            passthroughKeys: [...passthroughKeys.keys()]
        });
        if (message === previousInteractiveElements) return;
        previousInteractiveElements = message;
        window.seleneBridgeRequest({
            request: message, onFailure: (code, message) =>
                console.error('updateInteractionState failed', code, message)
        });
    }

    function isEditable(element) {
        return element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement ||
            element?.isContentEditable === true;
    }

    function dispatchPointerCallbacks(callbacks, x, y, button, shiftKey, coordinateX, coordinateY, coordinateZ) {
        const event = {
            clientX: x, clientY: y, button, shiftKey,
            coordinate: {x: coordinateX, y: coordinateY, z: coordinateZ}
        };
        for (const callback of [...callbacks]) callback(event);
    }

    window.__seleneBridge = Object.freeze({
        gamePointerDown(x, y, button, shiftKey, coordinateX, coordinateY, coordinateZ) {
            dispatchPointerCallbacks(pointerDownCallbacks, x, y, button, shiftKey, coordinateX, coordinateY, coordinateZ);
        },
        gamePointerUp(x, y, button, shiftKey, coordinateX, coordinateY, coordinateZ) {
            dispatchPointerCallbacks(pointerUpCallbacks, x, y, button, shiftKey, coordinateX, coordinateY, coordinateZ);
        },
        keyboard(type, key, shiftKey, ctrlKey, altKey, metaKey) {
            let target = null;
            for (let index = mounted.length - 1; index >= 0 && !target; index--)
                target = mounted[index].root.activeElement;
            target ??= document.activeElement ?? window;
            const event = new KeyboardEvent(type, {
                key, bubbles: true, cancelable: true, composed: true,
                shiftKey, ctrlKey, altKey, metaKey
            });
            target.dispatchEvent(event);
            if (type !== 'keydown' || event.defaultPrevented || !isEditable(target)) return;
            if (key === 'Enter') document.execCommand('insertLineBreak');
            else if (key === 'Backspace') document.execCommand('delete');
            else if (key === 'Delete') document.execCommand('forwardDelete');
        },
        deliverServerPayload(subscriptionId, payload) {
            const callback = payloadCallbacks.get(subscriptionId);
            if (!callback) return;
            try {
                callback(JSON.parse(payload));
            } catch (error) {
                console.error('Payload callback failed', subscriptionId, error);
            }
        },
        updateWorldCameraCoordinate(coordinate) {
            worldCoordinate = JSON.parse(coordinate);
            for (const callback of [...cameraCallbacks]) callback({...worldCoordinate});
        },
        updateWorldMapTiles(changes) {
            applyWorldTiles(JSON.parse(changes));
            for (const callback of [...mapCallbacks]) callback();
        }
    });

    worldReady.then(() => Promise.allSettled(entries.map(mountEntry))).then(results => {
        for (const [index, result] of results.entries()) {
            if (result.status === 'rejected') {
                logMountError(entries[index], result.reason);
            }
        }
        console.info(`Mounted ${mounted.length} of ${entries.length} bundle UI(s)`);
        interactionReportingEnabled = true;
        for (const ui of mounted) observeInteractiveElements(ui);
        window.addEventListener('resize', scheduleInteractiveElementsReporting);
        scheduleInteractiveElementsReporting();
    }).catch(error => {
        console.error(`Bundle UI runtime failed before entrypoints could mount: ${describeError(error)}`);
    });
</script>
</body>
</html>
